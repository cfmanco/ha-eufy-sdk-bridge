name: Format live P2P bridge feature
on:
  push:
    branches: ["feat/local-p2p-live-view"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - name: Format only changed files
        run: |
          npx prettier --write docs/private-lan-p2p.md test/live-budget.test.mjs test/local-addresses.test.mjs
          git diff --check
      - name: Commit formatting to this feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/private-lan-p2p.md test/live-budget.test.mjs test/local-addresses.test.mjs
            git commit -m "Format private P2P bridge feature"
            git push origin HEAD:feat/local-p2p-live-view
          fi
