# Security-development deployment only. Do not deploy until the companion HA client
# and encrypted cross-host media transport have passed integration testing.
services:
  ha-eufy-sdk-bridge:
    build:
      context: .
    image: ha-eufy-sdk-bridge:security-dev
    restart: unless-stopped
    # The bridge is separate from Home Assistant. Bind only the intended host interface.
    ports:
      - "${BRIDGE_BIND_IP:?Set BRIDGE_BIND_IP to a private host interface}:3000:3000/tcp"
    env_file:
      - .env
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "3000"
      GO2RTC_ENABLE: "0" # Stream export stays disabled until authenticated media path is implemented.
      BRIDGE_AUTH_TOKEN_FILE: /run/secrets/bridge-client-token
    volumes:
      # Pre-provision data/ as UID/GID 1000 with directory mode 0700.
      - ./data:/app/data:rw
      # This private file must be owned by UID 1000 and have mode 0400 or 0600.
      - "${BRIDGE_AUTH_TOKEN_HOST_FILE:?Set an absolute token file path}:/run/secrets/bridge-client-token:ro"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
